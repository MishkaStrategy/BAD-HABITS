name: Build BAD HABITS Pages branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish production branch
        run: |
          cp -R dist /tmp/bad-habits-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish-pages
          git rm -rf .
          cp -R /tmp/bad-habits-site/. .
          git add -A
          git commit -m "Publish BAD HABITS production"
          git push origin HEAD:gh-pages --force
